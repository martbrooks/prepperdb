# Replace the hostname and certificate/key paths. PREPPERDB_HTTPS must be 1.
server {
    listen 80;
    listen [::]:80;
    server_name stock.example.org;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stock.example.org;
    ssl_certificate /etc/prepperdb/tls/fullchain.pem;
    ssl_certificate_key /etc/prepperdb/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/prepperdb-app.conf;
}
