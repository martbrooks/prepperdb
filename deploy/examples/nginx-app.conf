# Included inside either the HTTP or HTTPS server block below.
client_max_body_size 11m;
add_header X-Content-Type-Options nosniff always;
location /static/ {
    root /srv/prepperdb;
    autoindex off;
    disable_symlinks on;
    try_files $uri =404;
}
location / {
    proxy_pass http://unix:/run/prepperdb/app.sock;
    proxy_set_header Host $http_host;
    proxy_set_header X-Prepperdb-Proto $scheme;
    proxy_set_header X-Prepperdb-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_read_timeout 30s;
}
