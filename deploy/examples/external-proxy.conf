# Optional example for a separate edge proxy in front of the VM's HTTPS nginx.
# Use your own origin address, names, edge certificate and trusted origin CA.
server {
    listen 443 ssl;
    server_name stock.example.org;
    ssl_certificate /etc/nginx/tls/public-fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/public-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 11m;
    location / {
        proxy_pass https://192.0.2.10;
        proxy_ssl_server_name on;
        proxy_ssl_name stock.example.org;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/tls/origin-ca.pem;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
